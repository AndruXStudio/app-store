name: annexus
description: "AnNexus - Open Source App Store"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  dio: ^5.7.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  intl: ^0.19.0
  permission_handler: ^11.3.1
  open_filex: ^4.5.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
