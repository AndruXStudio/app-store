name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: annexus-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload to release assets folder
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AnNexus-1.0.0.apk
          ls -lh dist/

      - name: Upload named APK
        uses: actions/upload-artifact@v4
        with:
          name: AnNexus-1.0.0
          path: dist/AnNexus-1.0.0.apk
          retention-days: 14
